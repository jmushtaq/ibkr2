{% extends 'markets/base.html' %}
{% load django_tables2 %}
{% load crispy_forms_tags %}

{% block title %}Market Data - {{ title }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">
                    <i class="fas fa-chart-bar"></i> {{ title }}
                </h5>
                <div>
                    <button class="btn btn-sm btn-light" type="button" data-bs-toggle="collapse" data-bs-target="#filterCollapse">
                        <i class="fas fa-filter"></i> Filters
                    </button>
                    <button class="btn btn-sm btn-light" onclick="exportToCSV()">
                        <i class="fas fa-download"></i> Export
                    </button>
                </div>
            </div>
            
            <!-- Filter Section -->
            <div class="collapse" id="filterCollapse">
                <div class="card-body bg-light">
                    <form method="get" class="form" id="filterForm">
                        <!-- ... filter fields ... -->
                    </form>
                </div>
            </div>
            
            <!-- Table Section -->
            <div class="card-body">
                <div class="table-responsive">
                    {% render_table table %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function exportToCSV() {
    let params = new URLSearchParams(window.location.search).toString();
    window.location.href = '/markets/export/?' + params;
}
</script>
{% endblock %}
