<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Market Dashboard{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- DataTables -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <!-- Custom CSS -->
    {% load static %}
    <link rel="stylesheet" href="{% static 'markets/css/style.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'markets:home' %}">
                <i class="fas fa-chart-line"></i> Market Dashboard
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'markets:market_list' %}">
                            <i class="fas fa-table"></i> Markets
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" id="refreshData">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </a>
                    </li>
                </ul>
                <form class="d-flex" role="search" id="quickSearch">
                    <input class="form-control me-2" type="search" placeholder="Quick search..." aria-label="Search">
                    <button class="btn btn-outline-light" type="submit">Go</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-3">
        {% block content %}{% endblock %}
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    
    {% block extra_js %}{% endblock %}
    
    <script>
        $(document).ready(function() {
            // Quick search
            $('#quickSearch').on('submit', function(e) {
                e.preventDefault();
                let searchTerm = $(this).find('input').val();
                window.location.href = "{% url 'markets:market_list' %}?search=" + encodeURIComponent(searchTerm);
            });
            
            // Refresh data
            $('#refreshData').on('click', function(e) {
                e.preventDefault();
                location.reload();
            });
        });
    </script>
</body>
</html>
